[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evaluacion_madurez_analitica"
version = "0.1.0"
description = "Evaluación de madurez analítica utilizando Modelos de Gartner y Deltha"
authors = [{name = "Equipo de Datos", email = "datos@organizacion.com"}]
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}

# Dependencias principales del proyecto
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "mlflow>=2.10.0",
    "jupyter>=1.0.0",
    "pytest>=8.0.0"
]

[project.optional-dependencies]
test = ["pytest-cov>=4.1.0"]
dev = ["black>=24.2.0", "flake8>=7.0.0", "mypy>=1.8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.black]
line-length = 88
include = '\\.pyi?$'
exclude = '''
/(
    \\.git
  | \\.hg
  | \\.mypy_cache
  | \\.tox
  | \\.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 88
ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true